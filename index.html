<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMSing - Audio Player</title>

    <!-- Open Graph / WhatsApp Preview Meta Tags -->
    <meta property="fb:app_id" content="157170091976300" />
    <meta property="og:title" content="UMSing - Listen to this Zoharon!" />
    <meta property="og:description" content="Someone shared a special audio message with you. Click to listen!" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://erezoren.github.io/UMSing/" />
    <meta property="og:image" content="https://erezoren.github.io/UMSing/thumbnail.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UMSing - Listen to this Zoharon!" />
    <meta name="twitter:description" content="Someone shared a special audio message with you. Click to listen!" />
    <meta name="twitter:image" content="https://erezoren.github.io/UMSing/thumbnail.png" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            gap: 30px;
            overflow: hidden;
        }

        /* =========================================================
           9355 NEON TITLE
           ========================================================= */

        .neon-title {
            margin: 0 0 10px 0;
            padding: 0;

            font-weight: 900;
            font-size: clamp(64px, 15vw, 160px);
            letter-spacing: 12px;
            text-align: center;
            line-height: 1;

            color: #ffffff;

            position: relative;
            z-index: 2;

            /*
             * Two animations:
             * 1. neonColor = slowly changes neon colors
             * 2. neonBlink = smooth breathing/blinking effect
             */
            animation:
                neonColor 6s ease-in-out infinite,
                neonBlink 3s ease-in-out infinite;

            will-change: opacity, transform, filter, text-shadow;
        }

        /* Smoothly cycles through neon colors */
        @keyframes neonColor {
            0% {
                color: #ffffff;
                text-shadow:
                    0 0 5px #ffffff,
                    0 0 15px #00ffff,
                    0 0 30px #00ffff,
                    0 0 55px #00ffff,
                    0 0 90px #0088ff;
            }

            20% {
                color: #ffffff;
                text-shadow:
                    0 0 5px #ffffff,
                    0 0 15px #ff00ff,
                    0 0 30px #ff00ff,
                    0 0 55px #ff00aa,
                    0 0 90px #aa00ff;
            }

            40% {
                color: #ffffff;
                text-shadow:
                    0 0 5px #ffffff,
                    0 0 15px #ff0066,
                    0 0 30px #ff0066,
                    0 0 55px #ff3300,
                    0 0 90px #ff0000;
            }

            60% {
                color: #ffffff;
                text-shadow:
                    0 0 5px #ffffff,
                    0 0 15px #ffff00,
                    0 0 30px #ffff00,
                    0 0 55px #ff9900,
                    0 0 90px #ff6600;
            }

            80% {
                color: #ffffff;
                text-shadow:
                    0 0 5px #ffffff,
                    0 0 15px #00ff66,
                    0 0 30px #00ff66,
                    0 0 55px #00ffaa,
                    0 0 90px #00ff88;
            }

            100% {
                color: #ffffff;
                text-shadow:
                    0 0 5px #ffffff,
                    0 0 15px #00ffff,
                    0 0 30px #00ffff,
                    0 0 55px #00ffff,
                    0 0 90px #0088ff;
            }
        }

        /* Smooth blinking / breathing */
        @keyframes neonBlink {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                filter: brightness(1);
            }

            25% {
                opacity: 0.92;
                transform: scale(1.015);
                filter: brightness(1.15);
            }

            50% {
                opacity: 0.72;
                transform: scale(0.99);
                filter: brightness(0.85);
            }

            75% {
                opacity: 0.95;
                transform: scale(1.01);
                filter: brightness(1.1);
            }
        }

        /* =========================================================
           PLAY BUTTON
           ========================================================= */

        .play-button {
            width: 150px;
            height: 150px;

            border-radius: 50%;
            border: none;

            background: linear-gradient(
                145deg,
                #2ecc71,
                #27ae60
            );

            box-shadow:
                0 10px 30px rgba(46, 204, 113, 0.4),
                inset 0 -5px 15px rgba(0, 0, 0, 0.2),
                inset 0 5px 15px rgba(255, 255, 255, 0.3);

            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;

            transition: all 0.3s ease;

            position: relative;
            overflow: hidden;
        }

        .play-button:hover {
            transform: scale(1.05);

            box-shadow:
                0 15px 40px rgba(46, 204, 113, 0.6),
                inset 0 -5px 15px rgba(0, 0, 0, 0.2),
                inset 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        .play-button:active {
            transform: scale(0.95);
        }

        /* Pulse when a shared audio file is waiting */
        .play-button.pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);

                box-shadow:
                    0 10px 30px rgba(46, 204, 113, 0.4),
                    inset 0 -5px 15px rgba(0, 0, 0, 0.2),
                    inset 0 5px 15px rgba(255, 255, 255, 0.3);
            }

            50% {
                transform: scale(1.1);

                box-shadow:
                    0 20px 50px rgba(46, 204, 113, 0.8),
                    inset 0 -5px 15px rgba(0, 0, 0, 0.2),
                    inset 0 5px 15px rgba(255, 255, 255, 0.3);
            }
        }

        .speaker-icon {
            width: 70px;
            height: 70px;

            fill: white;

            filter:
                drop-shadow(
                    0 2px 4px rgba(0, 0, 0, 0.3)
                );

            position: relative;
            z-index: 1;
        }

        /* =========================================================
           SHARE BUTTON
           ========================================================= */

        .share-button {
            padding: 18px 40px;

            border-radius: 50px;
            border: none;

            background: linear-gradient(
                145deg,
                #3498db,
                #2980b9
            );

            box-shadow:
                0 10px 30px rgba(52, 152, 219, 0.4),
                inset 0 -5px 15px rgba(0, 0, 0, 0.2),
                inset 0 5px 15px rgba(255, 255, 255, 0.3);

            cursor: pointer;

            transition: all 0.3s ease;

            position: relative;
            overflow: hidden;

            color: white;
            font-size: 18px;
            font-weight: bold;

            text-shadow:
                0 2px 4px rgba(0, 0, 0, 0.3);

            display: none;
            align-items: center;
            gap: 10px;
        }

        .share-button.visible {
            display: flex;
        }

        .share-button:hover {
            transform: scale(1.05);

            box-shadow:
                0 15px 40px rgba(52, 152, 219, 0.6),
                inset 0 -5px 15px rgba(0, 0, 0, 0.2),
                inset 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        .share-button:active {
            transform: scale(0.95);

            box-shadow:
                0 5px 15px rgba(52, 152, 219, 0.3),
                inset 0 5px 15px rgba(0, 0, 0, 0.3),
                inset 0 -5px 15px rgba(255, 255, 255, 0.1);
        }

        /* Shining effect */
        .share-button::before {
            content: '';

            position: absolute;
            top: -50%;
            left: -50%;

            width: 200%;
            height: 200%;

            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );

            transform: rotate(45deg);

            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% {
                transform:
                    translateX(-100%)
                    rotate(45deg);
            }

            100% {
                transform:
                    translateX(100%)
                    rotate(45deg);
            }
        }

        .share-icon {
            width: 24px;
            height: 24px;

            fill: white;

            filter:
                drop-shadow(
                    0 2px 4px rgba(0, 0, 0, 0.3)
                );

            position: relative;
            z-index: 1;
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 600px) {
            body {
                gap: 25px;
            }

            .neon-title {
                font-size: clamp(60px, 24vw, 110px);
                letter-spacing: 6px;
            }

            .play-button {
                width: 130px;
                height: 130px;
            }

            .speaker-icon {
                width: 62px;
                height: 62px;
            }

            .share-button {
                padding: 16px 30px;
                font-size: 16px;
            }
        }

        /* Respect users who prefer reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .neon-title {
                animation: none;

                text-shadow:
                    0 0 5px #ffffff,
                    0 0 15px #00ffff,
                    0 0 30px #00ffff,
                    0 0 55px #00ffff;
            }

            .play-button.pulse {
                animation: none;
            }

            .share-button::before {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         NEON 9355 TITLE
         ========================================================= -->

    <h1 class="neon-title" aria-label="9355">9355</h1>

    <!-- =========================================================
         PLAY BUTTON
         ========================================================= -->

    <button
        class="play-button"
        id="playButton"
        aria-label="Play random audio"
    >
        <svg
            class="speaker-icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
        >
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
    </button>

    <!-- =========================================================
         SHARE BUTTON
         ========================================================= -->

    <button
        class="share-button"
        id="shareButton"
        aria-label="Share the Zoharon"
    >
        <svg
            class="share-icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
        >
            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
        </svg>

        <span style="position: relative; z-index: 1;">
            Share the Zoharon
        </span>
    </button>

    <script>
        // =========================================================
        // CONFIGURATION
        // =========================================================

        const REMOTE_BASE_URL = 'audio/';

        let audioFiles = [];
        let currentAudio = null;
        let currentAudioFile = null;
        let pendingSharedFile = null;


        // =========================================================
        // LOAD AUDIO FILES
        // =========================================================

        async function loadAudioFiles() {
            try {
                const response = await fetch(
                    REMOTE_BASE_URL + 'files.json'
                );

                const data = await response.json();

                audioFiles = data.files.map(
                    file => REMOTE_BASE_URL + file
                );

                console.log(
                    `Loaded ${audioFiles.length} audio files from remote location`
                );

                checkForSharedFile();

            } catch (error) {
                console.error(
                    'Error loading audio files:',
                    error
                );

                console.log(
                    'Falling back to local audio directory'
                );

                loadLocalAudioFiles();
            }
        }


        // =========================================================
        // FALLBACK LOCAL AUDIO FILES
        // =========================================================

        function loadLocalAudioFiles() {
            audioFiles = [
                'audio/bell.mp3',
                'audio/bread.mp3',
                'audio/meeting.mp3',
                'audio/wa.mp3',
                'audio/zohar1.mp3',
                'audio/zohar2.mp3',
                'audio/zohar3.mp3',
                'audio/zohar4.mp3',
                'audio/zohar5.mp3',
                'audio/zohar6.mp3',
                'audio/zohar7.mp3',
                'audio/zohar8.mp3',
                'audio/zohar9.mp3',
                'audio/zohar10.mp3',
                'audio/zohar11.mp3',
                'audio/zohar12.mp3'
            ];

            console.log(
                `Using ${audioFiles.length} local audio files`
            );

            checkForSharedFile();
        }


        // =========================================================
        // CHECK FOR SHARED FILE
        // =========================================================

        function checkForSharedFile() {
            const urlParams =
                new URLSearchParams(window.location.search);

            const sharedFile =
                urlParams.get('file');

            if (sharedFile) {
                console.log(
                    'Shared file detected:',
                    sharedFile
                );

                pendingSharedFile = sharedFile;

                const playButton =
                    document.getElementById('playButton');

                playButton.classList.add('pulse');
            }
        }


        // =========================================================
        // PLAY SPECIFIC AUDIO FILE
        // =========================================================

        function playSpecificFile(filePath) {

            // Stop current audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            currentAudioFile = filePath;

            currentAudio = new Audio(filePath);

            currentAudio.play().catch(error => {
                console.error(
                    'Error playing audio:',
                    error
                );
            });

            // Show share button
            document
                .getElementById('shareButton')
                .classList.add('visible');
        }


        // =========================================================
        // GET RANDOM AUDIO FILE
        // =========================================================

        function getRandomAudio() {

            if (audioFiles.length === 0) {
                console.warn(
                    'No audio files available'
                );

                return null;
            }

            const randomIndex =
                Math.floor(
                    Math.random() * audioFiles.length
                );

            return audioFiles[randomIndex];
        }


        // =========================================================
        // PLAY BUTTON
        // =========================================================

        document
            .getElementById('playButton')
            .addEventListener('click', function() {

                // Stop pulsing
                this.classList.remove('pulse');

                // Play pending shared file
                if (pendingSharedFile) {

                    playSpecificFile(
                        pendingSharedFile
                    );

                    pendingSharedFile = null;

                    return;
                }

                // Stop current audio
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }

                // Select random audio
                const randomAudioFile =
                    getRandomAudio();

                if (randomAudioFile) {

                    currentAudioFile =
                        randomAudioFile;

                    currentAudio =
                        new Audio(randomAudioFile);

                    currentAudio.play().catch(error => {
                        console.error(
                            'Error playing audio:',
                            error
                        );
                    });

                    // Show share button
                    document
                        .getElementById('shareButton')
                        .classList.add('visible');
                }
            });


        // =========================================================
        // SHARE BUTTON
        // =========================================================

        document
            .getElementById('shareButton')
            .addEventListener('click', function() {

                if (!currentAudioFile) {
                    return;
                }

                // Base URL without query parameters
                const baseUrl =
                    window.location.origin +
                    window.location.pathname;

                // Create shareable URL
                const shareableUrl =
                    `${baseUrl}?file=${encodeURIComponent(
                        currentAudioFile
                    )}`;

                // WhatsApp share message
                const message =
                    encodeURIComponent(
                        shareableUrl
                    );

                const whatsappUrl =
                    `https://wa.me/?text=${message}`;

                // Open WhatsApp
                window.open(
                    whatsappUrl,
                    '_blank'
                );
            });


        // =========================================================
        // INITIALIZE
        // =========================================================

        loadAudioFiles();
    </script>

</body>
</html>
